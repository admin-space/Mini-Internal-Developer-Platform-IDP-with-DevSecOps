# Default values for mini-idp-backend.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/myorg/mini-idp-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Local PostgreSQL database configuration (provisioned inside the namespace by default)
postgresql:
  enabled: true
  host: "db-service"
  port: 5432
  database: "idp_db"
  username: "db_user"
  password: "db_password"

# ServiceMonitor configuration for Prometheus Operator
serviceMonitor:
  enabled: true

# Secrets management configuration
secrets:
  externalSecretsEnabled: false
  secretStoreName: "vault-store"
  secretStoreKind: "SecretStore"
  remoteSecretKey: "dev/mini-idp-backend"
  secretStoreProvider: "vault" # Supported: vault, aws

# Progressive delivery configuration via Argo Rollouts
rollout:
  enabled: false
  steps:
    - setWeight: 10
    - pause: { duration: 10s }
    - setWeight: 50
    - pause: { duration: 10s }

# Prometheus alerting rules configuration
prometheusRule:
  enabled: true
  additionalLabels:
    release: prometheus-stack
