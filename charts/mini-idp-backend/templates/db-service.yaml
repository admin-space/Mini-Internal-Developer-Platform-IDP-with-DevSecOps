{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgresql.host }}
  labels:
    {{- include "mini-idp-backend.labels" . | nindent 4 }}
    app: db
spec:
  ports:
    - port: {{ .Values.postgresql.port }}
      targetPort: 5432
      protocol: TCP
      name: dbport
  selector:
    app: {{ include "mini-idp-backend.fullname" . }}-db
{{- end }}
