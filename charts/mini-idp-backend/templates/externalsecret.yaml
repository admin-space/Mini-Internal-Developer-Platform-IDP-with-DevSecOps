{{- if .Values.secrets.externalSecretsEnabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mini-idp-backend.fullname" . }}-db-credentials
  labels:
    {{- include "mini-idp-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.secretStoreName }}
    kind: {{ .Values.secrets.secretStoreKind }}
  target:
    name: {{ include "mini-idp-backend.fullname" . }}-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.secrets.remoteSecretKey }}
        property: database-url
{{- end }}
