apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-idp-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/admin-space/Mini-Internal-Developer-Platform-IDP-with-DevSecOps.git
    targetRevision: main
    path: charts/mini-idp-backend
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
